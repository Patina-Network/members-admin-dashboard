[package]
name = "members-admin-dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics-exporter-prometheus = "0.18.3"
metrics-process = "2.4.3"
tower-http = { version = "0.7.1", features = ["catch-panic"] }
rust-embed = "8"
mime_guess = "2"
utoipa = { version = "5", features = ["axum_extras"] }
members-grpc-service = { version = "=1.0.0", registry = "patina" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
