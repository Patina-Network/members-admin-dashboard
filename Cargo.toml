[package]
name = "members-admin-dashboard"
version = "0.1.0"
edition = "2024"
default-run = "members-admin-dashboard"

[lib]
# src/duration.rs is a verbatim upstream copy whose doctests import the
# `duration_string` crate; the project has no other doctests.
doctest = false

[lints.rust]
# src/duration.rs gates optional code on an upstream `serde` feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("serde"))'] }

[dependencies]
anyhow = "1"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
time = "0.3"
serde_json = "1"
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics-exporter-prometheus = "0.18.3"
metrics-process = "2.4.3"
tower-http = { version = "0.7.1", features = ["catch-panic"] }
rust-embed = "8"
mime_guess = "2"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
members-grpc-service = { version = "=1.0.6-beta.g16bc4a7b", registry = "patina" }
axum-extra = { version = "0.12", features = ["cookie"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
tokio = { version = "1", features = ["test-util"] }
chrono = "0.4"
http-body-util = "0.1"
rsa = { version = "0.9", features = ["getrandom"] }
tower = { version = "0.5", features = ["util"] }
