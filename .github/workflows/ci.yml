# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: CI
run-name: Running continuous integration on ${{ github.actor }}'s commits

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backendTest:
    name: Backend tests
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@52eb2a0451daba94989db6a6fa232e689144aa50 # 1.0.96
        with:
          SECRETS: ${{ toJSON(secrets) }}
          LINT_CI: true
          HEADSCALE_ADDRESS: ${{ secrets.HEADSCALE_ADDRESS }}
          HEADSCALE_USER: ${{ secrets.HEADSCALE_USER }}
          HEADSCALE_PREAUTHKEY: ${{ secrets.HEADSCALE_PREAUTHKEY }}
          INSTALL_RUST: true
          RUST_TOOLCHAIN: "1.99.0"
          RUST_COMPONENTS: "clippy, rustfmt"
          CARGO_PACKAGES: cargo-tarpaulin

      - name: Run pre-test checks
        uses: ./.github/composite/pretest

      - name: Run tests
        uses: ./.github/composite/test

  buildImage:
    name: Build ${{ github.event_name == 'pull_request' && 'staging' || 'production' }} image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [backendTest]

    if: >-
      github.ref_name == 'main' ||
      github.event.pull_request.head.repo.full_name == github.repository

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@52eb2a0451daba94989db6a6fa232e689144aa50 # 1.0.96
        with:
          SECRETS: ${{ toJSON(secrets) }}
          LINT_CI: true
          HEADSCALE_ADDRESS: ${{ secrets.HEADSCALE_ADDRESS }}
          HEADSCALE_USER: ${{ secrets.HEADSCALE_USER }}
          HEADSCALE_PREAUTHKEY: ${{ secrets.HEADSCALE_PREAUTHKEY }}
          INSTALL_RUST: true
          RUST_TOOLCHAIN: "1.99.0"

      - name: Build image
        uses: ./.github/composite/build-image
        with:
          ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_ID: ${{ github.event.pull_request.number }}
          ARCH: ${{ matrix.arch }}

  deployStaging:
    name: Deploy to staging
    runs-on: ubuntu-26.04
    needs: [buildImage]

    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository

    concurrency:
      group: deploy-staging
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@52eb2a0451daba94989db6a6fa232e689144aa50 # 1.0.96
        with:
          SECRETS: ${{ toJSON(secrets) }}
          LINT_CI: true

      - name: Deploy client
        uses: ./.github/composite/deploy
        with:
          ENVIRONMENT: staging
          SHA: ${{ github.event.pull_request.head.sha }}

  createTag:
    name: Create new tag
    runs-on: ubuntu-26.04
    needs: [buildImage]

    if: github.ref_name == 'main'

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@52eb2a0451daba94989db6a6fa232e689144aa50 # 1.0.96
        with:
          SECRETS: ${{ toJSON(secrets) }}
          LINT_CI: true

      - name: Create new tag
        uses: ./.github/composite/create-tag
